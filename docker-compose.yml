# Docker Compose for SCOL Backend Infrastructure
# Provides PostgreSQL, Redis, and RabbitMQ services
#
# Usage:
#   docker-compose up -d                    # Start all services in detached mode
#   docker-compose up -d postgres redis     # Start specific services only
#   docker-compose down                     # Stop all services
#   docker-compose logs -f                 # View logs for all services
#   docker-compose logs -f postgres        # View logs for specific service

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: scol-postgres
    hostname: postgres
    ports:
      - '5432:5432' # PostgreSQL port
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scol_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scol-network

  # ============================================================================
  # Redis Cache & Rate Limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: scol-redis
    hostname: redis
    ports:
      - '6379:6379' # Redis port (consider not exposing in production)
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --loglevel notice
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - scol-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # RabbitMQ Message Broker
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: scol-rabbitmq
    hostname: rabbitmq
    ports:
      - '5672:5672'   # AMQP protocol port
      - '15672:15672' # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scol-network

  # ============================================================================
  # MailHog SMTP Server (for development/testing)
  # ============================================================================
  # Uncomment if you want to use MailHog for testing emails locally
  # mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: scol-mailhog
  #   ports:
  #     - '1025:1025'  # SMTP port
  #     - '8025:8025'  # Web UI port
  #   networks:
  #     - scol-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  rabbitmq_logs:
    driver: local

networks:
  scol-network:
    driver: bridge

